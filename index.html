<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>滋賀大学体育会弓道部</title>
<style>
:root{--bg:#f4f3ee;--sf:#fff;--ln:#e2e0d8;--ln2:#ccc9ba;--ink:#26241f;--sub:#7a766b;--faint:#aaa;--acc:#7a1f1f;--acc-bg:#f7ecec;--acc-ln:#e3c4c4;--good:#2a6536;--info:#1a4f7a;--warn:#8a5e10;--bad:#a33030;--sec:#faf9f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
.w{max-width:480px;margin:0 auto;padding:18px 16px 56px}
/* 横向き＋分附入力中のみ：480px制限を外して画面幅いっぱいに使う。
   横画面は高さが乏しいので、ヘッダーとタブも畳んで縦を稼ぐ。 */
@media (orientation:landscape){
  body.bun-land .w{max-width:none;padding:8px 10px 20px}
  body.bun-land .hd{display:none}
  body.bun-land .tb{display:none}
  body.bun-land .card{padding:10px 12px}
  body.bun-land .bun-sheet-wrap{margin:6px 0}
}
.hd{display:flex;align-items:center;gap:11px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--ln)}
.mk{width:40px;height:40px;flex:none;object-fit:contain}
h1{margin:0;font-size:17px;font-weight:700}
.hs{margin:2px 0 0;font-size:11.5px;color:var(--sub)}
.fl{display:none;margin-bottom:12px;padding:9px 13px;border-radius:9px;font-size:13px;font-weight:600}
.tb{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;margin-bottom:16px;background:var(--sf)}
.t{position:relative;flex:1;padding:10px 3px;font-size:12.5px;border:none;background:transparent;color:var(--sub);cursor:pointer;font-family:inherit;border-left:1px solid var(--ln)}
.t:first-child{border-left:none}
.t.on{background:var(--acc);color:#fff;font-weight:700}
/* 種別のラジオ選択。1行1択で押し間違いを防ぐ（タップ領域は行全体） */
.rdl{border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--sf);margin-bottom:4px}
.rdl label{display:flex;align-items:center;gap:9px;margin:0;padding:11px 12px;font-size:13.5px;font-weight:600;color:var(--tx,inherit);cursor:pointer;border-top:1px solid var(--ln)}
.rdl label:first-child{border-top:none}
.rdl label.on{background:var(--acc);color:#fff}
.rdl input[type=radio]{width:17px;height:17px;margin:0;flex:none;accent-color:var(--acc);pointer-events:none}
.rdl label.on input[type=radio]{accent-color:#fff}
.rdl .rd-tag{margin-left:auto;font-size:10.5px;font-weight:700;opacity:.65}
.rdl label.soon{opacity:.45;cursor:default}
.news-badge{position:absolute;top:3px;right:4px;min-width:15px;height:15px;padding:0 3px;background:var(--bad);color:#fff;border-radius:8px;font-size:9px;font-weight:800;line-height:15px;text-align:center;box-sizing:border-box}
.news-imp-tag{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--bad);border-radius:5px;padding:1px 7px;margin-right:6px;vertical-align:middle}
.news-banner{display:flex;align-items:flex-start;gap:8px;background:var(--acc-bg);border:1px solid var(--acc-ln);border-left:4px solid var(--acc);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.news-banner-x{border:none;background:none;color:var(--acc);cursor:pointer;font-size:17px;line-height:1;padding:0 2px;flex:none}
.hdr-badge{position:absolute;top:-3px;right:-5px;min-width:15px;height:15px;padding:0 3px;background:var(--bad);color:#fff;border-radius:8px;font-size:9px;font-weight:800;line-height:15px;text-align:center;box-sizing:border-box}
.ov-panel{background:var(--bg);border-radius:16px;max-width:440px;width:100%;max-height:85vh;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.28);display:flex;flex-direction:column}
.ov-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--ln);background:var(--sf);flex:none}
.ov-title{font-size:16px;font-weight:700}
.ov-close{border:none;background:none;font-size:20px;line-height:1;color:var(--sub);cursor:pointer;padding:4px 8px}
.ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov-inner{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:13px;padding:16px 18px;overflow:hidden}
.mb10{margin-bottom:10px}
label{display:block;font-size:12px;color:var(--sub);margin:11px 0 4px;font-weight:600}
.opt{color:var(--faint);font-weight:400}
input,select{width:100%;padding:9px 11px;font-size:14px;border:1px solid var(--ln2);border-radius:9px;background:var(--sf);color:var(--ink);font-family:inherit;outline:none;appearance:auto;box-sizing:border-box;-webkit-box-sizing:border-box}
input:focus,select:focus{border-color:var(--acc)}
/* iOS Safari: date入力がネイティブの最小幅で枠外へはみ出すのを抑える */
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:38px;line-height:1.2;text-align:left}
input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.2em}
input[type="date"]::-webkit-datetime-edit{padding:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.g2>*{min-width:0}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.sel-clean{appearance:none;-webkit-appearance:none;-moz-appearance:none;background-image:none;padding-right:28px;background:var(--sf) no-repeat right 11px center/10px 10px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M0 0 L5 6 L10 0 Z' fill='%23999'/></svg>")}
.btn{padding:9px 14px;font-size:13px;font-weight:700;border-radius:9px;cursor:pointer;font-family:inherit;border:1px solid transparent;white-space:nowrap}
.prim{background:var(--acc);color:#fff;width:100%;padding:13px;font-size:15px;margin-top:13px}
.bi{background:#e8f1f7;color:var(--info);border-color:#c8dded}
.bg{background:#e8f3ea;color:var(--good);border-color:#c5ddc9}
.br{background:var(--acc-bg);color:var(--bad);border-color:var(--acc-ln)}
.bh{background:var(--sf);color:var(--sub);border-color:var(--ln2)}
.pre{margin-top:11px;display:flex;justify-content:space-between;align-items:center;background:var(--sec);border:1px solid var(--ln);border-radius:9px;padding:9px 13px}
.v{font-size:22px;font-weight:800}
.li{display:flex;justify-content:space-between;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 14px;margin-bottom:6px}
.nm{font-weight:700}
.me{font-size:11px;color:var(--sub);margin-left:7px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.emp{text-align:center;color:var(--faint);padding:48px 0}
.tc{background:var(--sf);border:1px solid var(--ln);border-radius:13px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th{padding:8px 6px;font-size:11px;font-weight:700;color:var(--sub);background:var(--sec);text-align:center}
th.tl{text-align:left}
td{padding:8px 6px;border-top:1px solid var(--ln);text-align:center;vertical-align:middle}
td.tl{text-align:left}
tbody tr:nth-child(even){background:var(--sec)}
.sc{background:var(--sec);border:1px solid var(--ln);border-radius:10px;padding:9px 13px;margin-bottom:12px}
.frow{display:flex;gap:7px;margin-bottom:10px}
.frow select{padding:7px 9px;font-size:12.5px}
.yb{font-size:10px;color:var(--faint);margin-left:5px;font-weight:400}
.tag-m{color:var(--info)}
.tag-f{color:var(--bad)}
.mtbl{width:100%;border-collapse:collapse;font-size:13px}
.mtbl th{padding:7px 6px;font-size:11px;font-weight:700;color:var(--sub);background:var(--sec);text-align:center;border-bottom:1px solid var(--ln)}
.mtbl th.tl{text-align:left}
.mtbl td{padding:6px 5px;border-top:1px solid var(--ln);text-align:center;vertical-align:middle}
.mtbl td.tl{text-align:left;font-weight:600}
.mtbl select{padding:4px 6px;font-size:12px;border-radius:6px;width:auto}
.xb{border:none;background:none;color:var(--faint);cursor:pointer;font-size:16px;padding:0 3px;line-height:1}
.mchips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;margin-bottom:10px}
.mchip{padding:6px 12px;border:1px solid var(--ln2);border-radius:16px;background:var(--sf);font-size:12.5px;font-weight:600;color:var(--sub);white-space:nowrap;cursor:pointer;font-family:inherit;flex:none}
.mchip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.wkchks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.wkchk{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:6px;background:transparent;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.wkchk.on{background:var(--acc-bg);color:var(--acc)}
.wkchk input{margin:0;accent-color:var(--acc);width:16px;height:16px;flex:none}
.wk-dd{margin-bottom:10px}
.wk-dd-btn{width:100%;text-align:left;padding:9px 11px;font-size:14px;border:1px solid var(--ln2);border-radius:9px;background:var(--sf);font-weight:400;color:var(--ink);display:flex;align-items:center;cursor:pointer;font-family:inherit;box-sizing:border-box}
.wk-dd-btn:focus{border-color:var(--acc);outline:none}
.wk-dd-ar{margin-left:auto;color:var(--sub);font-size:11px;opacity:.7}
.wk-dd-panel{margin-top:6px;border:1px solid var(--ln2);border-radius:9px;padding:4px;max-height:260px;overflow-y:auto;background:var(--sf)}
.dan{background:var(--acc-bg);border:1px solid var(--acc-ln);border-radius:13px;padding:16px 18px}
.ib{border:none;background:none;cursor:pointer;color:var(--faint);font-size:17px;padding:4px 6px;line-height:1}
/* attendance inline accordion */
.att-wrap{margin:10px 0 2px;border:1px solid var(--ln2);border-radius:9px;overflow:hidden}
.att-hd{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 12px;cursor:pointer;background:var(--sec);user-select:none;gap:8px;border:none;font-family:inherit;text-align:left}
.att-hd:active{opacity:.8}
.att-body{padding:10px 12px 12px;border-top:1px solid var(--ln)}
.att-row{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;margin-bottom:4px;background:var(--sf);border:1px solid var(--ln);cursor:pointer;user-select:none}
.att-row:active{opacity:.7}
.att-absent{opacity:.35;background:var(--sec)}
.att-ck{font-size:15px;font-weight:700;width:20px;text-align:center;flex:none;color:var(--good)}
.att-absent .att-ck{color:var(--faint)}
.att-nm{font-weight:600;font-size:13.5px}
/* drag and drop */
[data-member-row]{transition:opacity .15s}
[data-member-row].dragging{opacity:.3}
[data-member-row].drop-over td{background:var(--acc-bg);border-top-color:var(--acc);}
[data-member-row].drop-over:first-child td{border-top:2px solid var(--acc);}
.dh{cursor:grab;display:inline-block;padding:2px 6px;touch-action:none;user-select:none}
.bkup-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:var(--bad);color:#fff;border-radius:50%;font-size:10px;font-weight:800;margin-left:4px;vertical-align:middle}
.bkup-banner{background:#fdf0f0;border:1px solid #f0c0c0;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:var(--bad);font-weight:600;line-height:1.5}
/* achievement badges */
.achv{display:inline-flex;align-items:center;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700;margin:2px}
.achv-on{background:#fdf3c0;color:#7a5200;border:1px solid #e8d060}
.achv-manual{background:#e8f3ea;color:#2a6536;border:1px solid #c5ddc9;cursor:pointer}
.achv-off{background:var(--sec);color:var(--faint);border:1px solid var(--ln);cursor:pointer}
.achv-img{display:inline-flex;flex-direction:column;align-items:center;padding:6px 4px;border-radius:10px;background:var(--sf);border:1px solid var(--ln)}
.achv-tappable{cursor:pointer}
.achv-tappable:active{opacity:.7}
/* 分附（縦・全部員・スクロール表） */
/* -webkit-overflow-scrolling:touch は iOS13以降不要で、sticky と組み合わせると描き直し漏れの原因になるため外す */
.bun-sheet-wrap{overflow-x:auto;margin:8px 0;border:1px solid var(--ln);border-radius:10px;touch-action:manipulation}
/* ○→✗と続けてタップするとiOSがダブルタップ扱いでズームしてしまうため、
   分附表の中だけダブルタップズームを無効化する。
   manipulation はスクロール・ピンチズームは残すので、横スクロールも拡大も従来どおり使える。 */
.bun-sheet-wrap,.bun-table,.bun-tc,.bun-total-row td,.bun-name-cell,#bun-namebar,#bun-namebar-scroll{touch-action:manipulation}
.bun-table{border-collapse:collapse;table-layout:fixed}
.bun-rn-r{position:sticky;right:0;z-index:2;background:var(--sec);border-left:1.5px solid var(--ln);font-size:10px;color:var(--faint);text-align:left;padding:0 4px 0 6px;width:28px;white-space:nowrap}
.bun-total-row td{position:sticky;top:0;z-index:4;padding:5px 4px;text-align:center;font-size:12px;background:var(--sec);border-bottom:2px solid var(--ink);width:50px;min-width:50px}
.bun-total-row .bun-rn-r{position:sticky;top:0;z-index:5;border-bottom:2px solid var(--ink)}
.bun-row td,.bun-row th{border:1px solid var(--ln2)}
.bun-row{height:38px}
.bun-tc{width:50px;min-width:50px;height:38px;max-height:38px;text-align:center;cursor:pointer;font-size:22px;font-weight:800;user-select:none;overflow:hidden;line-height:38px;padding:0}
/* :active の薄表示は、touchendでpreventDefaultするとiOSで押下状態が残り描き直しを妨げるため使わない */
.bun-tc-empty{background:var(--sf)}
.bun-tc-hit{background:#e8f3ea;color:var(--good)}
.bun-tc-miss{background:var(--acc-bg);color:var(--bad)}
.bun-tc{-webkit-touch-callout:none;-webkit-user-select:none}
.bun-fix-ov{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.18)}
.bun-fix-ov,.bun-fix-ov *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bun-fix-menu{position:fixed;width:204px;background:var(--sf);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:10px}
.bun-fix-ttl{font-size:12px;font-weight:700;color:var(--sub);text-align:center;margin-bottom:8px}
.bun-fix-btns{display:flex;gap:6px}
.bun-fix-btns button{flex:1;padding:12px 0;font-size:20px;font-weight:800;border:1px solid var(--ln);border-radius:8px;background:var(--sec);color:var(--ink)}
.bun-fix-btns button[data-v="o"]{color:var(--good)}
.bun-fix-btns button[data-v="x"]{color:var(--bad)}
.blg-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.blg-tbl td,.blg-tbl th{padding:4px 3px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
.blg-fix td{background:#fdf6e3}
.blg-self td{background:#fbe9e9;color:var(--bad);font-weight:700}
.bun-sep-row td{height:5px;background:var(--sec);border-top:2px dashed var(--ln2);border-bottom:2px dashed var(--ln2);padding:0}
.bun-name-row td,.bun-name-row th{position:sticky;bottom:0;z-index:3;border-top:2px solid var(--ink);background:var(--sec)}
.bun-name-cell{text-align:center;vertical-align:top;width:50px;min-width:50px;word-break:keep-all;position:relative;padding-bottom:24px}
.bun-sub{width:34px!important;min-width:34px!important;padding:2px 1px!important;background:var(--sec);border-left:2px dashed var(--ln2)!important;border-right:2px dashed var(--ln2)!important;vertical-align:middle;text-align:center}
.bun-sub .bs-c{font-size:12px;font-weight:800;line-height:1.15}
.bun-sub .bs-b{font-size:10px;color:var(--sub);line-height:1.15}
/* 試合詳細の閲覧用。画面幅に合わせて伸縮させ、横スクロールなしで1画面に収める */
.lg-sheet-wrap{overflow-x:auto;margin:6px -4px 4px;border:1px solid var(--ln);border-radius:10px}
.lg-ro .bun-table{width:100%}
.lg-ro .bun-row{height:var(--lgh,17px)}
.lg-ro .bun-tc{width:auto;min-width:0;height:var(--lgh,17px);max-height:none;line-height:var(--lgh,17px);font-size:calc(var(--lgh,17px)*0.55);cursor:default;position:relative;overflow:visible}
.lg-ro .bun-tc.lg-has-in{vertical-align:top;line-height:calc(var(--lgh,17px) - 10px)}
.lg-ro .lg-in{position:absolute;left:0;right:0;bottom:0;height:9px;line-height:9px;font-size:7px;font-weight:700;background:var(--sec);color:var(--ink);border-top:1px solid var(--ln2);white-space:nowrap;text-align:center;letter-spacing:-.02em;overflow:hidden;pointer-events:none}
.lg-ro .bun-sep-row td,.lg-ro .lg-sep{height:3px;padding:0;background:var(--sec);border-top:1.5px dashed var(--ln2);border-bottom:1.5px dashed var(--ln2)}
.lg-ro .lg-chg{background:var(--acc)!important;color:#fff;font-size:9.5px;font-weight:800;line-height:1.1;padding:2px 0!important;text-align:center;border-top:2px solid var(--acc)!important;border-bottom:2px solid var(--acc)!important}
.lg-ro .bun-total-row td{width:auto;min-width:0;padding:4px 0;font-size:12px}
.lg-ro .bun-name-cell{width:auto;min-width:0;padding-bottom:4px}
.lg-ro .lg-vn{display:inline-block;font-size:11px;font-weight:700;line-height:1.15;padding:4px 0}
.lg-ro .bun-sub{width:25px!important;min-width:25px!important;max-width:25px!important;padding:1px 0!important;border-left-width:1.5px!important;border-right-width:1.5px!important}
.lg-ro .bun-sub .bs-c{font-size:10.5px}
.lg-ro .bun-sub .bs-b{font-size:9px}
.lg-ro .bun-rn-r{width:17px;min-width:17px;padding:0 1px;font-size:8.5px;line-height:1;text-align:center;position:static}
.lg-ro .bun-total-row .bun-rn-r{position:static}
.lg-ro .bun-total-row td{position:static}
.bun-vsep{width:6px!important;min-width:6px!important;max-width:6px!important;padding:0!important;background:var(--sec);border-left:2px dashed var(--ln2)!important;border-right:2px dashed var(--ln2)!important}
.modal-ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1300;padding:24px}
.modal-bx{background:var(--sf);border-radius:16px;padding:20px 22px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.28);text-align:center}
.bun-vname{-webkit-writing-mode:vertical-rl;-ms-writing-mode:tb-rl;writing-mode:vertical-rl;-webkit-text-orientation:mixed;text-orientation:mixed;font-size:13px;font-weight:700;padding:6px 2px;display:inline-block;letter-spacing:.05em}
.bun-dragging{opacity:.3}
.bun-drop-over{outline:2px solid var(--acc);outline-offset:-2px}
.bun-namebar{position:fixed;bottom:0;z-index:50;background:var(--sec);border-top:2px solid var(--ink);box-shadow:0 -3px 10px rgba(0,0,0,.10)}
.bun-namebar-scroll{overflow-x:hidden}
.bun-namebar .bun-name-cell{padding-bottom:4px;padding-top:4px}
.bun-namebar table{margin:0}
/* タップ感：押した瞬間に沈み込み、離すと弾んで戻ってから画面が切り替わる（分附表の中は連打するので対象外） */
button,.mchip{transition:transform .15s ease,filter .15s ease}
button:not(:disabled):active,.mchip:active{transform:scale(.93);filter:brightness(.85);transition-duration:0s}
@keyframes tapBounce{0%{transform:scale(.93);filter:brightness(.85)}55%{transform:scale(1.04);filter:brightness(1)}100%{transform:scale(1)}}
button.tap-bounce{animation:tapBounce .12s ease-out}
/* 連結したタブ（.tb 内の .t）は1つだけ拡大縮小すると継ぎ目に白い隙間が出るので、
   ボタンの枠は動かさず、中の文字（.t-lb）だけ沈んで弾ませる。押したタブは色でも示す */
.tb .t .t-lb{display:inline-block;transition:transform .15s ease}
.tb .t:not(:disabled):active .t-lb{transform:scale(.88);transition-duration:0s}
@keyframes tapBounceLabel{0%{transform:scale(.88)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
.tb .t.tap-bounce .t-lb{animation:tapBounceLabel .12s ease-out}
.tb .t:not(:disabled):active{transform:none;filter:none;background:var(--acc-bg);transition-duration:0s}
.tb .t.on:not(:disabled):active{background:var(--acc);filter:brightness(.85)}
@keyframes tapFlash{from{background-color:var(--acc-bg)}to{background-color:transparent}}
@keyframes tapFlashOn{from{filter:brightness(.85)}to{filter:brightness(1)}}
.tb .t.tap-bounce{animation:tapFlash .12s ease-out}
.tb .t.on.tap-bounce{animation:tapFlashOn .12s ease-out}
.bun-sheet-wrap button,.bun-namebar button{transition:none}
.bun-sheet-wrap button:active,.bun-namebar button:active{transform:none;filter:none}
/* 画面が切り替わったときだけ中身を表示し直す。
   中に position:fixed の要素（名前バー・モーダル）がある画面は transform でずれるので透明度のみ */
@keyframes conFade{from{opacity:0}to{opacity:1}}
@keyframes conSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#con.con-fade{animation:conFade .14s ease-out}
#con.con-slide>*{animation:conSlide .16s cubic-bezier(.2,.8,.2,1)}
@keyframes conFwd{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes conBack{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
#con.con-fwd>*{animation:conFwd .15s cubic-bezier(.2,.8,.2,1)}
#con.con-back>*{animation:conBack .15s cubic-bezier(.2,.8,.2,1)}
#con.con-fwd,#con.con-back{overflow-x:clip}
@media (prefers-reduced-motion:reduce){button,.mchip,.tb .t .t-lb{transition:none}.tb .t:active .t-lb{transform:none}button.tap-bounce,.tb .t.tap-bounce,.tb .t.tap-bounce .t-lb,#con.con-fade,#con.con-slide>*,#con.con-fwd>*,#con.con-back>*{animation:none}}
/* メインタブが5つ（管理者）のときは文字を詰めて「マイページ」がはみ出さないようにする */
#tabs .t:first-child:nth-last-child(5),#tabs .t:first-child:nth-last-child(5)~.t{font-size:11.5px;padding-left:0;padding-right:0;letter-spacing:-.02em}
/* 画面内の切り替え・入力の選択：グレーの台の上で、選んだものだけ白く浮く（メインタブの赤と区別する） */
.tb.seg{background:#ebe9e2;border:none;padding:3px;border-radius:10px;gap:2px}
.tb.seg .t{border-left:none;border-radius:8px;padding:8px 3px;color:var(--sub)}
.tb.seg .t.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tb.seg .t:not(:disabled):active{background:rgba(255,255,255,.65)}
.tb.seg .t.on:not(:disabled):active{background:#fff;filter:brightness(.85)}
@keyframes segFlash{from{background-color:rgba(255,255,255,.65)}to{background-color:transparent}}
.tb.seg .t.tap-bounce{animation:segFlash .12s ease-out}
.tb.seg .t.on.tap-bounce{animation:tapFlashOn .12s ease-out}
</style>
</head>

/* ---- 匿名認証（Firebase Authentication を REST で利用） ----
   アプリを開くと裏で匿名アカウントの通行証（IDトークン、有効1時間）を受け取り、
   データベースへの読み書きすべてに ?auth=トークン を付ける。
   データベースのルールで「トークンのある通信だけ許可」にすると、URLを直接たたいた
   アクセスや公開DBを巡回するボットは拒否される。部員の操作は何も変わらない。
   ・匿名アカウントの再発行用トークン（refresh token）は端末に保存し、毎回同じアカウントを使う
   ・取得に失敗したときはトークンなしで通信する（ルールを閉じる前なら今まで通り動く） */
var FB_API_KEY='AIzaSyCWYNbjz6IlnJWz-uevYwPqMW6oCzayMJs';
var KAUTH='kyudo_auth_v1';
var _authTok='',_authExp=0,_authWait=null,_authRetryAt=0,_authTimer=null;
function _authLoadRt(){try{return localStorage.getItem(KAUTH)||'';}catch(e){return '';}}
function _authSaveRt(rt){try{if(rt)localStorage.setItem(KAUTH,rt);else localStorage.removeItem(KAUTH);}catch(e){}}
function _authJson(r){
  return r.json().catch(function(){return {};}).then(function(j){
    if(!r.ok){var er=new Error('auth http '+r.status);er.status=r.status;throw er;}
    return j;
  });
}
function _authSignUp(){
  return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB_API_KEY,{
      method:'POST',headers:{'Content-Type':'application/json'},body:'{"returnSecureToken":true}'})
    .then(_authJson)
    .then(function(j){return {id:j.idToken,rt:j.refreshToken,exp:parseInt(j.expiresIn,10)||3600};});
}
function _authRefresh(rt){
  return fetch('https://securetoken.googleapis.com/v1/token?key='+FB_API_KEY,{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)})
    .then(_authJson)
    .then(function(j){return {id:j.id_token,rt:j.refresh_token,exp:parseInt(j.expires_in,10)||3600};});
}
function _authRequest(){
  var rt=_authLoadRt();
  if(!rt)return _authSignUp();
  return _authRefresh(rt).catch(function(er){
    // 保存していた再発行用トークンが無効（アカウント削除など）なら、新しい匿名アカウントを作り直す
    if(er&&er.status>=400&&er.status<500){_authSaveRt('');return _authSignUp();}
    throw er;
  });

/* 有効なトークンを返す（Promise）。取れなければ ''。force=true で期限内でも取り直す */
function authToken(force){
  if(!FB_API_KEY||FB_API_KEY.indexOf('__')===0)return Promise.resolve('');
  if(!force&&_authTok&&Date.now()<_authExp-60000)return Promise.resolve(_authTok);
  if(!force&&!_authTok&&Date.now()<_authRetryAt)return Promise.resolve('');  // 直前に失敗したばかり
  if(_authWait)return _authWait;
  _authWait=_authRequest().then(function(a){
    _authTok=a.id;_authExp=Date.now()+a.exp*1000;_authSaveRt(a.rt);_authWait=null;
    // 期限の5分前に先回りして取り直す
    clearTimeout(_authTimer);
    _authTimer=setTimeout(function(){authToken(true);},Math.max(60000,a.exp*1000-300000));
    return _authTok;
  },function(){
    _authWait=null;_authRetryAt=Date.now()+60000;
    return (_authTok&&Date.now()<_authExp)?_authTok:'';
  });
  return _authWait;
}
function dbUrl(base,tok){return base+'.json'+(tok?'?auth='+encodeURIComponent(tok):'');}
/* データベースへの fetch。トークンを付け、401（期限切れなど）なら1回だけ取り直して再送 */
function dbFetch(base,opts){
  return authToken().then(function(t){return fetch(dbUrl(base,t),opts);})
    .then(function(r){
      if(r.status!==401||!_authTok)return r;
      return authToken(true).then(function(t){return fetch(dbUrl(base,t),opts);});
    });
}

function _normList(v){ // レコード列：nullは除去し詰める
  if(v==null)return [];
  if(Array.isArray(v))return v.filter(function(x){return x!=null;});
  return Object.keys(v).sort(function(a,b){return a-b;})
    .map(function(k){return v[k];}).filter(function(x){return x!=null;});
}
function _normObj(v){return (v&&typeof v==='object'&&!Array.isArray(v))?v:(v==null?{}:v);}
function _normCol(v){ // 分附の列：添字を保持（null=未入力を保つ）
  if(v==null)return [];
  if(Array.isArray(v))return v.slice();
  var out=[];Object.keys(v).forEach(function(k){out[+k]=v[k];});
  for(var i=0;i<out.length;i++)if(out[i]===undefined)out[i]=null;
  return out;
}
function _padCol(arr){var n=bunShotCount();arr=arr||[];while(arr.length<n)arr.push(null);return arr;}

/* ---- 同期の単位 ----
   rec  : レコード配列。DB上は {キー:レコード} で持ち、1件ずつ書き込む
          （同時に別の人が記録を足しても、互いの追加・変更を消さない）
   map  : {名前や週:値}。キーごとに書き込む
   whole: 値まるごと（部員の並び順・PIN）
   「最後にサーバーと一致していた状態」(_base) を覚えておき、
   手元で変わったキーだけ送る／手元で変えていないキーだけサーバーに合わせる（三者比較）。 */
var _SEC_KIND={S:'rec',P:'rec',SP:'rec',Jobs:'rec',News:'rec',GM:'rec',Meta:'map',A:'map',Pins:'map',M:'whole',pin:'whole',shonaiPin:'whole'};
var _SECS=Object.keys(_SEC_KIND);
var _EMPTYABLE=['P','Jobs','SP','News','A','Pins','GM']; // 全体スナップショットでキーが無い＝空。S/M/Metaは誤消去防止のため対象外
var KBASE='kyudo_syncbase_v1';
var _base={};        // セクション→{キー→ハッシュ}
var _migrate={};     // 旧形式（配列まるごと）で届いたセクション。次の送信でキー形式へ一括置き換え
var _allowMass={};   // 全消去・インポートなど、意図的な大量削除を許可するセクション
var _pushing=false,_ackGen=0,_pushFails=0;

function _secGet(k){
  switch(k){case 'S':return S;case 'P':return P;case 'SP':return SP;case 'Jobs':return Jobs;case 'News':return News;case 'GM':return GM;
    case 'Meta':return Meta;case 'A':return A;case 'Pins':return Pins;case 'M':return M;case 'pin':return ADMIN_PIN;case 'shonaiPin':return SHONAI_PIN;}
}
function _secSet(k,v){
  switch(k){case 'S':S=v;break;case 'P':P=v;break;case 'SP':SP=v;break;case 'Jobs':Jobs=v;break;case 'News':News=v;break;case 'GM':GM=v;break;
    case 'Meta':Meta=v;break;case 'A':A=v;break;case 'Pins':Pins=v;break;case 'M':M=_normList(v);break;
    case 'pin':ADMIN_PIN=(typeof v==='string')?v:'';break;case 'shonaiPin':SHONAI_PIN=(typeof v==='string')?v:'';break;}
}
/* Firebaseと同じ見え方に揃える（null・空配列・空オブジェクトは「無い」、配列は添字キーのオブジェクト） */
function _fbNorm(v){
  if(v==null)return undefined;
  if(typeof v==='number')return isFinite(v)?v:undefined;
  if(v==='')return undefined;
  if(typeof v!=='object')return (typeof v==='function')?undefined:v;
  var o={},n=0;
  Object.keys(v).forEach(function(k){var x=_fbNorm(v[k]);if(x!==undefined){o[k]=x;n++;}});
  return n?o:undefined;
}
function _canon(v){
  if(typeof v!=='object')return JSON.stringify(v);
  return '{'+Object.keys(v).sort().map(function(k){return JSON.stringify(k)+':'+_canon(v[k]);}).join(',')+'}';
}
function _cyrb(str){
  var h1=0xdeadbeef,h2=0x41c6ce57;
  for(var i=0;i<str.length;i++){var c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function _hash(v){var n=_fbNorm(v);return n===undefined?undefined:_cyrb(_canon(n));}

/* レコードのDB上のキー。部員ごとの記録は「id＋部員名」で、端末間でidが重なっても衝突しない */
function _recKey(sec,r){
  var k='r'+((r.id!=null)?String(r.id).replace(/[.$#\[\]\/]/g,'_'):('h'+_hash(r)));
  if(r.mb!=null&&(sec==='S'||sec==='P'||sec==='SP'))k+='_'+_cyrb(String(r.mb));
  return k;
}
function _recMap(sec,arr){
  var out={};
  (arr||[]).forEach(function(r){
    if(r==null||typeof r!=='object')return;
    var k=_recKey(sec,r),kk=k,i=2;
    while(kk in out)kk=k+'~'+(i++);
    out[kk]=r;
  });
  return out;
}
function _recArr(map){
  return Object.keys(map).sort(function(a,b){
    var ia=+map[a].id,ib=+map[b].id;
    if(ia!==ib&&!isNaN(ia)&&!isNaN(ib))return ia-ib;
    return a<b?-1:a>b?1:0;
  }).map(function(k){return map[k];});
}
function _isLegacyRec(v){
  if(Array.isArray(v))return v.length>0;
  if(!v||typeof v!=='object')return false;
  var ks=Object.keys(v);
  return ks.length>0&&ks.every(function(k){return /^\d+$/.test(k);});
}
function _localMap(sec){
  var kind=_SEC_KIND[sec],v=_secGet(sec);
  if(kind==='rec')return _recMap(sec,v);
  if(kind==='map')return (v&&typeof v==='object'&&!Array.isArray(v))?v:{};
  return {_:v};
}
function _remoteMap(sec,v){
  var kind=_SEC_KIND[sec];
  if(kind==='rec'){
    _migrate[sec]=_isLegacyRec(v);
    if(_migrate[sec])return _recMap(sec,_normList(v));
    return (v&&typeof v==='object')?v:{};
  }
  if(kind==='map')return (v&&typeof v==='object'&&!Array.isArray(v))?v:{};
  return {_:v};
}
function _commitMap(sec,L){
  var kind=_SEC_KIND[sec];
  if(kind==='rec')_secSet(sec,_recArr(L));
  else if(kind==='map')_secSet(sec,L);
  else _secSet(sec,L._);
}
/* 1キー分の三者比較。手元が未変更ならサーバー値を採用。戻り値：手元を書き換えたか */
function _mergeOne(L,B,k,rv){
  var lh=_hash(L[k]),bh=B[k],rh=_hash(rv),changed=false;
  if(lh===bh&&lh!==rh){
    if(rh===undefined)delete L[k];else L[k]=rv;
    changed=true;
  }
  if(rh===undefined)delete B[k];else B[k]=rh;
  return changed;
}
function _mergeSec(sec,rv){ // セクション全体が届いた
  var R=_remoteMap(sec,rv),L=_localMap(sec),B=_base[sec]||(_base[sec]={});
  var keys={};[L,R,B].forEach(function(o){Object.keys(o).forEach(function(k){keys[k]=1;});});
  var changed=false;
  Object.keys(keys).forEach(function(k){if(_mergeOne(L,B,k,R[k]))changed=true;});
  if(changed)_commitMap(sec,L);
  if(_migrate[sec]){_dirty[sec]=true;}
  return changed;
}
function _mergeKey(sec,k,rv){ // 1件だけ届いた
  var L=_localMap(sec),B=_base[sec]||(_base[sec]={});
  var changed=_mergeOne(L,B,k,rv);
  if(changed)_commitMap(sec,L);
  return changed;
}
/* 手元とサーバーの差分 → PATCH用の {パス:値}。null は削除 */
function _secDiff(sec){
  var kind=_SEC_KIND[sec],L=_localMap(sec),B=_base[sec]||{},out={},nb={},n=0,del=0;
  if(_migrate[sec]){ // 旧形式 → キー形式へ丸ごと置き換え
    var all={};Object.keys(L).forEach(function(k){var h=_hash(L[k]);if(h!==undefined){all[k]=L[k];nb[k]=h;}});
    out[sec]=Object.keys(all).length?all:null;
    return {body:out,base:nb,whole:true,n:1};
  }
  if(kind==='whole'){
    var h=_hash(L._);
    if(h===B._)return null;
    out[sec]=(h===undefined)?null:L._;
    if(h!==undefined)nb._=h;
    return {body:out,base:nb,whole:true,n:1};
  }
  Object.keys(L).forEach(function(k){
    var h=_hash(L[k]);
    if(h!==B[k]){out[sec+'/'+k]=(h===undefined)?null:L[k];nb[k]=h;n++;if(h===undefined&&B[k]!==undefined)del++;}
  });
  Object.keys(B).forEach(function(k){if(!(k in L)){out[sec+'/'+k]=null;nb[k]=undefined;n++;del++;}});
  if(!n)return null;
  // 安全弁：手元のキャッシュ消失などで大量の削除を送ろうとしている → 削除は送らずサーバーから取り直す
  var total=Object.keys(B).length;
  if(!_allowMass[sec]&&del>20&&del>total*0.5){
    Object.keys(out).forEach(function(p){if(out[p]===null){delete out[p];var k=p.slice(sec.length+1);delete B[k];n--;}});
    _schedulePull();
    if(!n)return null;
  }
  return {body:out,base:nb,whole:false,n:n};
}
function _loadBase(){try{var b=JSON.parse(localStorage.getItem(KBASE)||'null');return (b&&typeof b==='object')?b:null;}catch(e){return null;}}
function _saveBase(){
  if(_lsFailed)return;
  try{localStorage.setItem(KBASE,JSON.stringify(_base));}
  catch(e){_lsFailed=true;try{localStorage.removeItem(KBASE);}catch(ex){}}
}
/* 起動時：保存済みの基準が無いセクションは「手元のキャッシュ＝サーバーと一致」とみなす
   （旧版からの更新直後に、他端末で消された記録を復活させないため）。
   手元のキャッシュ自体が無いセクションは基準も空にする（全件削除と誤認しないため）。 */
function _initBase(missing){
  var saved=_loadBase()||{};
  _base={};
  _SECS.forEach(function(sec){
    if(missing&&missing.indexOf(sec)>=0){_base[sec]={};return;}
    if(saved[sec]&&typeof saved[sec]==='object'){_base[sec]=saved[sec];return;}
    var L=_localMap(sec),b={};
    Object.keys(L).forEach(function(k){var h=_hash(L[k]);if(h!==undefined)b[k]=h;});
    _base[sec]=b;
  });
  _saveBase();
}

/* ---- ダーティ管理 & 差分プッシュ（PATCH） ---- */
function markDirty(sec){_dirty[sec]=true;}
function markAllDirty(){_SECS.forEach(markDirty);}
function scheduleDbPush(){if(_loading)return;if(_dbTimer)clearTimeout(_dbTimer);_dbTimer=setTimeout(dbPush,600);}
/* 送信が実際に成功してから走らせたい処理を積む（例：分附の下書き削除）。
   失敗した場合はキューに残り、再試行が成功したときに実行される。 */
var _pushDoneCbs=[];
function onPushSuccess(cb){_pushDoneCbs.push(cb);}
function _runPushDoneCbs(){
  var cbs=_pushDoneCbs;_pushDoneCbs=[];
  cbs.forEach(function(cb){try{cb();}catch(ex){}});
}
/* デバウンスを待たず即送信（保存確定時・アプリ離脱時に使う） */
function dbPushNow(){if(_dbTimer){clearTimeout(_dbTimer);_dbTimer=null;}dbPush();}
function pendingCount(){return Object.keys(_dirty).length;}
function dbPush(){
  if(_dbTimer){clearTimeout(_dbTimer);_dbTimer=null;}
  if(_loading)return;
  if(_pushing){_dirty._again=true;return;} // 送信は1本ずつ（応答後に続きを送る）
  delete _dirty._again;
  // 送るものは _dirty に頼らず全項目をサーバーとの差で決める
  // （sv〇〇() の呼び忘れがあっても、次に何か保存したときに一緒に送られる）
  var secs=_SECS.slice();
  // 安全弁：部員数0を送ろうとしている場合は誤操作の疑い
  if((!M||M.length===0)&&_everHadRemoteData&&!_allowMass.M){
    secs=secs.filter(function(k){return k!=='M';});
    if(_hash(M)!==(_base.M||{})._)_dot('var(--bad)','同期中止(空データ)');
  }
  var body={},parts=[];
  secs.forEach(function(sec){
    var d=_secDiff(sec);
    if(d){Object.keys(d.body).forEach(function(p){body[p]=d.body[p];});parts.push({sec:sec,d:d});}
  });
  _dirty={};
  // 送る分は先に端末にも保存しておく（端末の保存とサーバーがずれないように）
  var lk=parts.map(function(x){return x.sec;}).filter(function(k){return _SEC_KIND[k]!=='whole'||k==='M';});
  if(lk.length)saveLocal(lk);
  if(parts.some(function(x){return x.sec==='pin'||x.sec==='shonaiPin';}))savePinCache();
  if(!parts.length){if(_pushDoneCbs.length)_runPushDoneCbs();return;}
  body.t=Date.now();body.by=CLIENT_ID;
  body.initialized=true;   // 使用中の印。全削除後に、閉じていた端末が古いデータを送り直さないための目印
  _pushing=true;
  _dot('var(--warn)','同期中...');
  var json=JSON.stringify(body);
  // keepalive：アプリを閉じる瞬間の送信も最後まで届ける（ブラウザの上限64KB未満のときだけ）
  dbFetch(DB,{method:'PATCH',headers:{'Content-Type':'application/json'},body:json,keepalive:json.length<60000})
    .then(function(r){
      if(!r.ok)throw new Error('http '+r.status);
      parts.forEach(function(x){
        var B=_base[x.sec]||(_base[x.sec]={});
        if(x.d.whole&&_SEC_KIND[x.sec]!=='whole'){_base[x.sec]=x.d.base;_migrate[x.sec]=false;}
        else if(x.d.whole){if(x.d.base._===undefined)delete B._;else B._=x.d.base._;}
        else Object.keys(x.d.base).forEach(function(k){if(x.d.base[k]===undefined)delete B[k];else B[k]=x.d.base[k];});
        delete _allowMass[x.sec];
      });
      _saveBase();_ackGen++;_pushFails=0;
      _pushing=false;
      _dot('var(--good)','同期済み');
      if(pendingCount()){dbPush();return;} // 送信中に増えた変更（続きの送信成功後に後処理）
      _runPushDoneCbs();            // 送信が確定してから後処理（下書き削除など）
    })
    .catch(function(){
      _pushing=false;
      parts.forEach(function(x){_dirty[x.sec]=true;}); // 失敗した分を再ダーティ化（差分は次回作り直す）
      _pushFails++;
      _dot('var(--bad)','同期エラー(再試行します)');
      if(!_dbTimer)_dbTimer=setTimeout(dbPush,Math.min(30000,4000*_pushFails));
    });
}

/* ---- リモート適用 ---- */
function _afterApply(secs){
  if(!secs.length)return;
  if(secs.indexOf('M')>=0&&M.length>0)_everHadRemoteData=true;
  // リモート反映後に番号未設定・重複が出ることがあるので整える（他端末にも反映して番号を揃える）
  if(secs.indexOf('M')>=0||secs.indexOf('Meta')>=0){
    if(initNums()){markDirty('Meta');scheduleDbPush();}
  }
  saveLocal(secs);savePinCache();_saveBase();
  if(Object.keys(_migrate).some(function(k){return _migrate[k];}))scheduleDbPush();
}
function _applyRemote(d){ // 全体スナップショット
  if(d.t)_lastKnownRemoteTs=d.t;
  // initialized（使用中の印）があれば、無いセクションは「意図的に空にされた」とみなす
  var inited=!!d.initialized;
  var hit=[];
  _SECS.forEach(function(sec){
    if(sec in d){_mergeSec(sec,d[sec]);hit.push(sec);}
    else if(inited||_EMPTYABLE.indexOf(sec)>=0){
      if(_SEC_KIND[sec]==='whole'&&sec!=='M')return;   // PINは消さない
      _mergeSec(sec,null);hit.push(sec);
    }
  });
  _afterApply(hit);
}
/* パス単位の反映（put/patch の各要素）。対応できない深さは全体を取り直す */
function _applyPath(path,v){
  var seg=String(path||'').split('/').filter(function(s){return s!=='';});
  if(!seg.length){
    if(v&&typeof v==='object')_applyRemote(v);
    return;
  }
  var sec=seg[0];
  if(sec==='t'||sec==='by'){if(sec==='t'&&v)_lastKnownRemoteTs=v;return;}
  if(!(sec in _SEC_KIND))return;
  if(seg.length===1){_mergeSec(sec,v);_afterApply([sec]);return;}
  if(seg.length===2&&_SEC_KIND[sec]!=='whole'&&!(_SEC_KIND[sec]==='rec'&&/^\d+$/.test(seg[1]))){
    _mergeKey(sec,seg[1],v);_afterApply([sec]);return;
  }
  _schedulePull();
}
function _hasData(d){
  if(!d||typeof d!=='object')return false;
  function ne(v){return !!v&&typeof v==='object'&&Object.keys(v).length>0;}
  return ne(d.M)||ne(d.S);
}
function _hasLocalData(){return M.length>0||S.length>0;}
function _isEmptyVal(v){return Array.isArray(v)?v.length===0:(v&&typeof v==='object'&&Object.keys(v).length===0);}

/* ---- 全体の取り直し ---- */
var _pullTimer=null;
function _schedulePull(){if(_pullTimer)clearTimeout(_pullTimer);_pullTimer=setTimeout(function(){_pullTimer=null;dbPull(_repaintUnlessBun);},400);}
function dbPull(cb,_retry){
  _dot('var(--warn)','接続中...');
  var gen=_ackGen;
  dbFetch(DB)
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(function(d){
      // 取得中に自分の送信が確定した／送信中 → この結果は送信前の古い状態かもしれないので取り直す
      if((_pushing||gen!==_ackGen)&&(_retry||0)<5){setTimeout(function(){dbPull(cb,(_retry||0)+1);},500);return;}
      if(_hasData(d)||(d&&d.initialized)){
        _applyRemote(d);             // サーバーを正とし、手元で変えた分だけ残す（全削除後なら手元も空になる）
      }else if(_hasLocalData()){
        // サーバーが本当に空（使用中の印も無い＝DBごと消えた）：手元のデータを送り直す
        // （PUTではなくPATCHなので下書き等は消さない）
        _SECS.forEach(function(sec){_base[sec]={};});_saveBase();
        markAllDirty();scheduleDbPush();
      }
      // PINがまだ一度も設定されていないDB：初期PINを（ハッシュで）設定
      if(!ADMIN_PIN)svPin('admin','1234');
      if(!SHONAI_PIN)svPin('shonai','5678');
      savePinCache();
      _dot('var(--good)','同期済み');
      if(cb)cb();
    })
    .catch(function(){_dot('var(--bad)','オフライン');if(cb)cb(true);});
}
function hasBunInput(){
  return Object.keys(bunData).some(function(k){
    return (bunData[k]||[]).some(function(s){return s!==null;});
  });
}
/* 分附入力中でも表のスクロール位置とページ位置を保ったまま描き直す */
function _repaintKeepScroll(){
  if(!(tab==='input'&&bunStep==='input')){paint();return;}
  var w=document.querySelector('.bun-sheet-wrap'),sx=w?w.scrollLeft:0,sy=w?w.scrollTop:0;
  var py=window.pageYOffset||document.documentElement.scrollTop||0;
  paint();
  var nw=document.querySelector('.bun-sheet-wrap');if(nw){nw.scrollLeft=sx;nw.scrollTop=sy;}
  restorePageScroll(py);
}
function _repaintUnlessBun(){if(!(tab==='input'&&hasBunInput()))paint();}

/* 分附の下書き(kyudo/bunDraft)は本体DBの子なので、本体ストリームにも流れてくる。
   入力中は0.5秒ごとに書き込むため、これで全体取り直しを走らせるとDB全体の再取得が
   連発し、送信前のローカル変更（出席など）が巻き戻る。専用リスナーに任せる。 */
function _isDraftPath(path){return !!path&&/^\/bunDraft(\/|$)/.test(path);}
/* ---- リアルタイム購読（put=全体 / patch=差分） ---- */
var _es=null;
function dbListen(){
  authToken().then(_dbListenWith);
}
function _dbListenWith(tok){
  try{
    if(_es){try{_es.close();}catch(ex){}_es=null;}
    var src=new EventSource(dbUrl(DB,tok));
    _es=src;
    // トークンの期限切れ（auth_revoked）・権限なし（cancel）は、取り直してからつなぎ直す
    src.addEventListener('auth_revoked',function(){try{src.close();}catch(ex){}authToken(true).then(function(){if(_es===src)dbListen();});});
    src.addEventListener('cancel',function(){try{src.close();}catch(ex){}setTimeout(function(){authToken(true).then(function(){if(_es===src)dbListen();});},8000);});
    src.addEventListener('put',function(e){
      try{
        var p=JSON.parse(e.data);var path=p&&p.path;var d=p&&p.data;
        if(_isDraftPath(path))return;                     // 下書きは専用リスナーが処理（本体を取り直さない）
        if(path==='/'||!path){
          if(!_hasData(d)&&!(d&&d.initialized))return;     // 印も無い空の全体は無視（誤消去防止）
          _applyRemote(d);                                 // 三者比較なので自分の書き込みが混ざっていても安全
        }else _applyPath(path,d);                          // 1件・1セクション単位の書き込み
        _dot('var(--good)','同期済み');
        _repaintUnlessBun();
      }catch(ex){}
    });
    src.addEventListener('patch',function(e){
      try{
        var p=JSON.parse(e.data);var path=p&&p.path;var d=p&&p.data;
        if(_isDraftPath(path))return;                     // 下書きは専用リスナーが処理
        if(!d||typeof d!=='object')return;
        if(d.by===CLIENT_ID)return;                       // 自分の書き込み（エコー抑止）
        var base=(path==='/'||!path)?'':path;
        Object.keys(d).forEach(function(k){
          var full=base+'/'+k;
          if(_isDraftPath(full))return;
          _applyPath(full,d[k]);
        });
        _dot('var(--good)','同期済み');
        _repaintUnlessBun();
      }catch(ex){}
    });
    src.onerror=function(){
      _dot('var(--bad)','接続断');
      if(src.readyState===2)setTimeout(dbListen,8000);   // CLOSEDなら再接続
    };
  }catch(ex){}
}

/* ===== §04 分附の下書き同期 ===== */
function _buildDraftPayload(){
  return {sid:bunSid||null,d:bunD,date:bunDate,mode:bunMode,tate:bunTate,tateList:bunTateList,order:bunOrder,data:bunData,
          lineup:bunLineup,opp:bunOpp,oppHits:bunOppHits,first:bunFirst,venue:bunVenue,kind:bunKind,final:bunFinal||null,editId:lgEditId||null,
          kyosha:{te:bunKyo.te,hon:bunKyo.hon},updatedAt:Date.now(),by:CLIENT_ID};
}
/* 列の中身を比較用の文字列にする（Firebaseは末尾のnullを落とすので長さを揃える） */
function _colSig(col){
  var n=bunShotCount(),a=(col||[]).slice();
  while(a.length<n)a.push(null);
  a.length=n;
  return JSON.stringify(a.map(function(v){return v===undefined?null:v;}));
}
function scheduleDbPushDraft(name){
  // name省略＝並べ替えなどの構造変更。全体PUTにすると他端末が入力中の列まで
  // 手元の内容で消してしまうので、data以外のキーだけを送るPATCHにする。
  if(name==null)_draftMeta=true; else _draftDirty[name]=true;
  if(_loading)return;   // 読み込み中は印だけ付けておき、読み込み完了後にまとめて送る
  if(_draftTimer)clearTimeout(_draftTimer);
  _draftTimer=setTimeout(_flushDraft,500);
}
/* 下書きの作成・作り直し。既に下書きがある時はPUTせず、
   構造＋自分の全列をPATCHでマージする（他端末の列を消さない）。 */
function dbPushDraft(){
  if(hasBunDraft()&&bunSid&&bunDraftRemote.sid&&bunDraftRemote.sid!==bunSid){_abandonStaleBun('別の分附が始まっているため、この端末の入力を終了しました');return;}
  if(hasBunDraft()){
    _draftMeta=true;
    Object.keys(bunData).forEach(function(nm){_draftDirty[nm]=true;});
  }else{
    _draftFull=true;
  }
  _flushDraft();
}
var _draftChain=Promise.resolve();   // 下書きの送信は1本ずつ順番に（作成PUTより先に列PATCHが届かないように）
/* 送信失敗時は右上の丸で知らせ、間隔を空けて自動で再送（4秒→8秒→…最大30秒） */
var _draftFails=0,_draftRetry={},_draftOkSid='';   // _draftOkSid: サーバーに作成できたと確認した分附のsid
function _draftFailed(key,fn){
  _draftFails++;
  _dot('var(--bad)','下書きの同期エラー(再試行します)');
  if(_draftRetry[key])return;
  _draftRetry[key]=setTimeout(function(){_draftRetry[key]=null;fn();},Math.min(30000,4000*Math.pow(2,Math.min(_draftFails,4)-1)));
}
function _draftOk(){if(_draftFails){_draftFails=0;_dot('var(--good)','同期済み');}}
function _flushDraft(){
  if(_draftTimer){clearTimeout(_draftTimer);_draftTimer=null;}
  if(_draftFull){
    _draftFull=false;_draftMeta=false;_draftDirty={};
    if(!bunDate)return;              // 記録・破棄で入力が終わっている（作り直さない）
    if(!bunSid)bunSid='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    Object.keys(bunData).forEach(function(nm){_draftSent[nm]=_colSig(bunData[nm]);});
    var payload=JSON.stringify(_buildDraftPayload());
    var newSid=bunSid,allNames=Object.keys(bunData);
    _draftInfl(allNames,1);
    _draftChain=_draftChain.then(function(){
      return dbFetch(DRAFT_DB,{method:'PUT',headers:{'Content-Type':'application/json'},body:payload})
        .then(function(r){if(!r.ok)throw new Error('http '+r.status);_draftOkSid=newSid;_draftOk();});
    }).catch(function(){
      // 作成に失敗：入力は残したまま、作成からやり直す
      if(bunSid===newSid){_draftFull=true;_draftFailed('flush',_flushDraft);}
    }).then(function(){_draftInfl(allNames,-1);});
    return;
  }
  var names=Object.keys(_draftDirty);
  var meta=_draftMeta;
  if(!names.length&&!meta)return;
  _draftDirty={};_draftMeta=false;
  var body={updatedAt:Date.now(),by:CLIENT_ID};
  if(meta){ // dataは触らない
    body.d=bunD;body.date=bunDate;body.mode=bunMode;
    body.tate=bunTate;body.tateList=bunTateList;body.order=bunOrder||null;
    body.lineup=_isEmptyVal(bunLineup)?null:bunLineup;body.opp=bunOpp||null;body.oppHits=bunOppHits||null;
    body.first=bunFirst||null;body.venue=bunVenue||null;body.kind=bunKind||null;body.final=bunFinal||null;body.editId=lgEditId||null;
    body.kyosha={te:bunKyo.te||{},hon:bunKyo.hon||{}};   // 競射（_buildDraftPayload と項目をそろえること）
  }
  names=names.filter(_bunColValid);   // 今の分附に属さない列は送らない
  /* 【重要】'data/名前' という「パス指定」で送ること。body.data={名前:…} のように
     入れ子にすると、他の端末が入力中の列まで丸ごと上書きして消してしまう。書き換え禁止。 */
  names.forEach(function(nm){body['data/'+nm]=bunData[nm]||null;_draftSent[nm]=_colSig(bunData[nm]);}); // 変更列のみ深いPATCH
  _draftInfl(names,1);
  var mySid=bunSid;
  _draftChain=_draftChain.then(function(){
    // 送る前に、サーバーの下書きが自分の分附のままか確かめる（sidのない古い下書きは確かめない）
    if(!mySid)return true;
    return dbFetch(DRAFT_DB+'/sid').then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
      .then(function(remoteSid){
        if(remoteSid===mySid){_draftOkSid=mySid;return true;}
        // サーバーに無いのは「まだ作成できていない」だけ（作成の送信が失敗していた）→ 作成からやり直す
        if(!remoteSid&&_draftOkSid!==mySid&&!(bunDraftRemote&&bunDraftRemote.sid===mySid)){
          if(bunSid===mySid){_draftFull=true;_draftFailed('flush',_flushDraft);}
          return false;
        }
        if(bunSid===mySid)_abandonStaleBun(remoteSid?'別の分附が始まっているため、この端末の入力を終了しました':null);
        return false;
      });
  }).then(function(ok){
    if(!ok)return;
    return dbFetch(DRAFT_DB,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){if(!r.ok)throw new Error('http '+r.status);_draftOk();});
  }).catch(function(){
    names.forEach(function(nm){_draftDirty[nm]=true;});if(meta)_draftMeta=true;
    if(bunSid===mySid)_draftFailed('flush',_flushDraft);
  }).then(function(){_draftInfl(names,-1);});
}
function _draftInfl(names,dlt){
  names.forEach(function(nm){var n=(_draftInflight[nm]||0)+dlt;if(n>0)_draftInflight[nm]=n;else delete _draftInflight[nm];});
}
/* 下書きの削除。sid: 消したい分附のsid（記録後は入力状態が先に初期化されるので呼び出し時に渡す） */
function dbDeleteDraft(sid){
  if(typeof sid!=='string')sid=bunSid||(bunDraftRemote&&bunDraftRemote.sid)||'';
  _draftFull=false;_draftMeta=false;_draftDirty={};_draftSent={};
  if(_draftRetry.flush){clearTimeout(_draftRetry.flush);_draftRetry.flush=null;}
  bunDraftRemote=null;
  _deleteDraftTry(sid);
}
/* 毎回、消したい分附の下書きかを確かめてから消す（その間に別の端末が始めた分附を消さない） */
var KDRDEL='kyudo_draftdel_v1';   // 記録後の下書き削除の予約（アプリを閉じても次回起動時に実行）
function _deleteDraftTry(sid){
  function del(){return dbFetch(DRAFT_DB,{method:'PUT',headers:{'Content-Type':'application/json'},body:'null'})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);});}
  dbFetch(DRAFT_DB+'/sid').then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(function(remoteSid){
      if(sid)return (remoteSid===sid)?del():null;   // 別のsid＝新しい分附なので消さない
      return remoteSid?null:del();                  // sidの無い旧形式の下書きは消す（無ければ何も起きない）
    })
    .then(function(){
      try{if(localStorage.getItem(KDRDEL)===sid)localStorage.removeItem(KDRDEL);}catch(e){}
      _draftOk();
    })
    .catch(function(){_draftFailed('del',function(){_deleteDraftTry(sid);});});
}
/* 記録後：本記録の送信が成功してから下書きを消す。予約は端末にも残す */
function _queueDraftDelete(sid){
  try{localStorage.setItem(KDRDEL,sid||'');}catch(e){}
  onPushSuccess(dbDeleteDraft.bind(null,sid||''));
}
function _normDraft(d){ // 受信下書きを正規化
  if(!d)return null;
  if(d.tateList!=null&&!Array.isArray(d.tateList))
    d.tateList=Object.keys(d.tateList).sort(function(a,b){return a-b;}).map(function(k){return d.tateList[k];});
  if(d.order!=null&&!Array.isArray(d.order))
    d.order=Object.keys(d.order).sort(function(a,b){return a-b;}).map(function(k){return d.order[k];});
  if(d.data){
    Object.keys(d.data).forEach(function(nm){d.data[nm]=_normCol(d.data[nm]);});
  }
  if(d.lineup){ // Firebaseは配列を添字オブジェクトで返すことがある
    Object.keys(d.lineup).forEach(function(k){
      var v=d.lineup[k];
      if(v&&!Array.isArray(v))d.lineup[k]=Object.keys(v).sort(function(a,b){return a-b;}).map(function(i){return v[i];});
    });
  }
  return d;
}
function dbPullDraft(cb){
  dbFetch(DRAFT_DB)
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(function(d){bunDraftRemote=(d&&d.d)?_normDraft(d):null;if(cb)cb();})
    .catch(function(){if(cb)cb();});
}
function _syncBunCellsToDom(){ // スクロール位置を保ったままセルだけ更新
  var updated=false;
  Object.keys(bunData).forEach(function(name){
    (bunData[name]||[]).forEach(function(s,idx){
      var cell=document.querySelector('[data-bun-name="'+cssAttr(name)+'"][data-bun-idx="'+idx+'"]');
      if(cell){
        updated=true;
        cell.className=bunCellCls(name,idx,s);
        cell.textContent=s===true?'○':s===false?'✗':'';
      }
    });
    var hi=(bunData[name]||[]).filter(function(v){return v===true;}).length;
    var tc=document.querySelector('[data-bun-total="'+cssAttr(name)+'"]');
    if(tc){
      tc.textContent=hi;
      tc.style.color=hi>=14?'var(--good)':hi>=10?'var(--info)':hi>=7?'var(--warn)':'var(--ink)';
    }
  });
  if(updated)bunRefreshSaveBtn();
  return updated;
}
/* 受信した列を手元に取り込む。次の3つは取り込まない：
   ・自分が送った内容がそのまま返ってきたエコー（往復中のタップを巻き戻すため）
   ・まだ送っていない手元の入力がある列（手元が最新）
   ・送信中で結果待ちの列 */
function _applyDraftCol(nm,col){
  if(!_bunColValid(nm))return false;   // 今の分附に属さない列（別の分附の残りなど）は取り込まない
  if(!bunDraftRemote)bunDraftRemote={};
  if(!bunDraftRemote.data)bunDraftRemote.data={};
  bunDraftRemote.data[nm]=col;
  if(_draftDirty[nm]||_draftInflight[nm])return false;   // 未送信・送信中の列は手元が新しい
  var sig=_colSig(col),mine=(_draftSent[nm]===sig);
  delete _draftSent[nm];                                   // 「次に返ってくる1回分」として一度だけ使う
  if(mine)return false;
  if(tab==='input'&&bunStep==='input'){bunData[nm]=col;return true;}
  return false;
}
function _applyDraftData(obj){
  var hit=false;
  Object.keys(obj).forEach(function(nm){if(_applyDraftCol(nm,_normCol(obj[nm])))hit=true;});
  // 手元にしか無い列（相手がまだ知らない列）は消さない
  return hit;
}
function _refreshDraftAfterPull(){
  if(tab==='input'&&bunStep==='input'){
    if(bunDraftRemote&&bunDraftRemote.data){
      _applyDraftData(bunDraftRemote.data);
      if(bunDraftRemote.order&&!_draftMeta)bunOrder=bunDraftRemote.order;
      if(!_syncBunCellsToDom())paint();
    }else{paint();}
  }else if(tab==='input'&&bunStep==='mo-sess'){paint();}
}
/* 下書きが「実体として存在する」か。列だけのpatchで作られた空オブジェクトで
   新規作成が塞がれてしまわないよう、日付を持つものだけを進行中とみなす。 */
function hasBunDraft(){var d=bunDraftRemote;return !!(d&&(d.d||d.date));}
function _draftRepaint(){
  if(tab==='input'&&bunStep==='input'){if(!_syncBunCellsToDom())paint();}
  else if(tab==='input'&&bunStep==='mo-sess')paint();
}
/* put=そのパスの中身が丸ごと置き換わった通知 */
function _onDraftPut(e){
  try{
    var p=JSON.parse(e.data),path=p&&p.path,d=p&&p.data;
    if(path==='/'){
      if(!d||!d.d){ // 下書きが削除された（保存・破棄された）
        bunDraftRemote=null;_draftSent={};
        if(bunSid&&bunStep!=='mo-sess'){_abandonStaleBun();return;}   // 自分が入力中の分附が他の端末で記録・破棄された
        if(tab==='input'&&bunStep==='mo-sess')paint();
        return;
      }
      if(bunSid&&d.sid&&d.sid!==bunSid&&bunStep!=='mo-sess'){_abandonStaleBun('別の分附が始まっているため、この端末の入力を終了しました');return;}
      if(d.by===CLIENT_ID){bunDraftRemote=_normDraft(d);return;} // 自分の書き込み
      var nd=_normDraft(d);
      bunDraftRemote=nd;
      if(tab==='input'&&bunStep==='input'){
        if(nd.data)_applyDraftData(nd.data);
        if(nd.order&&!_draftMeta)bunOrder=nd.order;
      }
      _draftRepaint();
      return;
    }
    if(path==='/data'){
      if(!bunDraftRemote){dbPullDraft(_refreshDraftAfterPull);return;}
      var obj={};if(d)Object.keys(d).forEach(function(nm){obj[nm]=_normCol(d[nm]);});
      bunDraftRemote.data=obj;
      _applyDraftData(obj);
      _draftRepaint();
      return;
    }
    var m=path&&path.match(/^\/data\/(.+)$/);
    if(m){
      if(!bunDraftRemote){dbPullDraft(_refreshDraftAfterPull);return;}
      _applyDraftCol(m[1],_normCol(d));
      _draftRepaint();
      return;
    }
    if(path&&path!=='/'){ // 構造キーなど
      if(!bunDraftRemote){dbPullDraft(_refreshDraftAfterPull);return;}
      var k=path.replace(/^\//,'');
      if(k&&k.indexOf('/')<0){bunDraftRemote[k]=d;_draftRepaint();return;}
    }
    dbPullDraft(_refreshDraftAfterPull);
  }catch(ex){}
}
/* patch=指定パス配下の一部キーだけが変わった通知。
   列単位PATCHでは data={"data/名前":[...],updatedAt,by} の形で届き、
   全体スナップショット（d.dを持つ）ではないので put と同じ扱いにはできない。 */
function _onDraftPatch(e){
  try{
    var p=JSON.parse(e.data),path=p&&p.path,d=p&&p.data;
    if(!d||typeof d!=='object')return;
    if(d.by===CLIENT_ID)return;   // 自分の送信の戻り（遅れて届いた古い内容で表示を戻さない）
    if(!bunDraftRemote){dbPullDraft(_refreshDraftAfterPull);return;} // 手元にリモート像が無ければ取り直す
    var base=(path==='/'||!path)?'':path.replace(/^\//,'');
    var unknown=false;
    Object.keys(d).forEach(function(k){
      var full=base?(base+'/'+k):k;
      if(full==='updatedAt'||full==='by'){return;}
      var m=full.match(/^data\/([^/]+)$/);
      if(m){_applyDraftCol(m[1],_normCol(d[k]));return;}
      if(full==='data'){_applyDraftData(d[k]||{});bunDraftRemote.data=bunDraftRemote.data||{};return;}
      if(full.indexOf('/')<0){bunDraftRemote[full]=d[k];return;}
      unknown=true; // data/名前/添字 などの深いパッチ
    });
    if(unknown){dbPullDraft(_refreshDraftAfterPull);return;}
    if(bunDraftRemote.order&&!_draftMeta&&tab==='input'&&bunStep==='input')bunOrder=_normDraft(bunDraftRemote).order;
    _draftRepaint();
  }catch(ex){}
}
var _esDraft=null;
function dbListenDraft(){
  authToken().then(function(tok){
    try{
      if(_esDraft){try{_esDraft.close();}catch(ex){}_esDraft=null;}
      var src=new EventSource(dbUrl(DRAFT_DB,tok));
      _esDraft=src;
      src.addEventListener('put',_onDraftPut);
      src.addEventListener('patch',_onDraftPatch);
      src.addEventListener('auth_revoked',function(){try{src.close();}catch(ex){}authToken(true).then(function(){if(_esDraft===src)dbListenDraft();});});
      src.addEventListener('cancel',function(){try{src.close();}catch(ex){}setTimeout(function(){authToken(true).then(function(){if(_esDraft===src)dbListenDraft();});},8000);});
      src.onerror=function(){if(src.readyState===2)setTimeout(dbListenDraft,8000);};
    }catch(ex){}
  });
}

function assignRanks(sorted){
  // 正確な分数比較で同率を判定し、順位を飛ばす
  // 例: 1位2人→次は3位
  var result=[];var rank=1;var i=0;
  while(i<sorted.length){
    var cur=sorted[i];
    var j=i+1;
    while(j<sorted.length){
      var nxt=sorted[j];
      // 整数のクロス乗算で完全一致のみ同率（浮動小数点誤差を排除）
      var tied=(cur.sh>0&&nxt.sh>0)
        ?(cur.hi*nxt.sh===nxt.hi*cur.sh)
        :(cur.sh===0&&nxt.sh===0);
      if(!tied)break;
      j++;
    }
    for(var k=i;k<j;k++){
      result.push(Object.assign({},sorted[k],{rank:rank,rate:sorted[k].sh?sorted[k].hi/sorted[k].sh:0}));
    }
    rank+=(j-i); // 同率n人分だけ次の順位を飛ばす
    i=j;
  }
  return result;
}
function getStats(d){

  else src=S.filter(function(e){return e.d===d;});
  var active=activeMbs();var mp={};
  src.filter(function(e){return!active||active.has(e.mb);}).forEach(function(e){
    if(!mp[e.mb])mp[e.mb]={name:e.mb,sh:0,hi:0};
    mp[e.mb].sh+=e.sh;mp[e.mb].hi+=e.hi;
  });
  var sorted=Object.values(mp).sort(function(a,b){return(b.sh?b.hi/b.sh:0)-(a.sh?a.hi/a.sh:0);});
  return assignRanks(sorted);
}

    if(multi||!tgt){tgt=null;return;}
    var el=tgt;tgt=null;
    if(moved)return;                                  // スクロールだった（合成clickも出ない）
    // ここから先は指が動いていないので、ブラウザの合成clickを止めてから判定する
    if(e.cancelable)e.preventDefault();               // ダブルタップ拡大と合成clickを抑止
    _bunTapAt=Date.now();
    if(longFired){try{var sel=window.getSelection&&window.getSelection();if(sel)sel.removeAllRanges();}catch(ex){}return;}   // 長押し（メニュー表示済み）
    if(stopper||_bunScrollAt>=st)return;  // スクロールを止めたタップ／押している間に動いた
    bunCellTap(el,false);
  },{passive:false});
  wrap.addEventListener('touchcancel',function(){tgt=null;},{passive:true});
}

function setupBunNameBar(){
  var sheet=document.querySelector('.bun-sheet-wrap');
  var bar=document.getElementById('bun-namebar');
  var barScroll=document.getElementById('bun-namebar-scroll');
  if(!sheet||!bar||!barScroll){window.onscroll=null;window.onresize=null;return;}
  function place(){var r=sheet.getBoundingClientRect();bar.style.left=r.left+'px';bar.style.width=r.width+'px';barScroll.scrollLeft=sheet.scrollLeft;}
  function vis(){
    var nr=sheet.querySelector('.bun-name-row');
    if(!nr){bar.style.display='none';return;}
    var rect=nr.getBoundingClientRect();
    var hide=rect.top<(window.innerHeight-4); // 実際の名前行が画面内に入ったら固定バーを隠す
    if(hide){bar.style.display='none';}
    else{bar.style.display='block';place();}
  }
  sheet.addEventListener('scroll',function(){barScroll.scrollLeft=sheet.scrollLeft;});
  // 回転判定用。モバイルではURLバーの開閉でもresizeが飛ぶため、
  // 「向きが変わったとき」だけスクロール位置を戻す（操作中に勝手に動かさない）。
  var _wasLand=window.innerWidth>window.innerHeight;
  window.onscroll=vis;
  window.onresize=function(){
    vis();
    var land=window.innerWidth>window.innerHeight;
    if(land!==_wasLand){
      _wasLand=land;
      // はみ出す場合のみ1の立側（右端）へ寄せ直す
      if(sheet.scrollWidth>sheet.clientWidth+2)sheet.scrollLeft=sheet.scrollWidth;
      place();
    }
  };
  vis();
}

/* ボタンは離した後の弾みを少し見せてから処理する（約0.05秒）。
   分附表内・入力欄・ダウンロード/印刷/読込/生体認証（ユーザー操作直後でないと端末に止められる）は即時 */
var TAP_DELAY=50,_tapBusy=false,TAP_NODELAY=/csv|print|export|import|bio/;
function tapDispatch(ev){
  var btn=ev.target&&ev.target.closest?ev.target.closest('button'):null;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!btn||btn.disabled||reduce||btn.closest('.bun-sheet-wrap,.bun-namebar')||TAP_NODELAY.test(btn.id||'')){
    dispatch(ev,CLICK_ID,CLICK_ATTR);return;
  }
  if(_tapBusy)return;
  _tapBusy=true;
  btn.classList.remove('tap-bounce');void btn.offsetWidth;btn.classList.add('tap-bounce');
  var fake={target:ev.target,type:ev.type,preventDefault:function(){},stopPropagation:function(){}};
  setTimeout(function(){
    _tapBusy=false;
    if(!document.contains(btn))return;
    btn.classList.remove('tap-bounce');
    dispatch(fake,CLICK_ID,CLICK_ATTR);
  },TAP_DELAY);
}
function _elId(t){return (t&&t.nodeType===1&&typeof t.id==='string')?t.id:'';}
function dispatch(ev,byId,byAttr){
  var t=ev.target;
  while(t&&t!==document){
    if(t.nodeType===1){
      var id=_elId(t);
      if(id&&byId&&byId[id]){byId[id](t,ev);return;}
      if(byAttr){
        for(var i=0;i<byAttr.length;i++){
          if(t.hasAttribute&&t.hasAttribute(byAttr[i][0])){byAttr[i][1](t,ev);return;}
        }
      }
    }
    t=t.parentNode;
  }
}
function initDelegation(){
  /* アプリが背面に回る瞬間に未送信分を即送信（デバウンス待ちの取りこぼし防止） */
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden'){
      if(pendingCount())dbPushNow();
      if(_draftTimer)_flushDraft();
      return;
    }
    /* 復帰時：バックグラウンド中は購読(EventSource)が切れていることがあり、
       そのまま操作すると「古い手元のデータ」を送って他端末の変更（部員追加など）を
       消してしまう。まず未送信分を送り、購読を張り直して最新を取り直す。
       手元で変えた分は三者比較で残るので上書きされない。 */
    if(_loading)return;
    if(pendingCount())dbPushNow();
    if(!_es||_es.readyState===2)dbListen();
    if(!_esDraft||_esDraft.readyState===2)dbListenDraft();
    dbPull(_repaintUnlessBun);
    // 入力中なら、他の端末で進んだ下書きを入力画面にも反映する
    dbPullDraft(function(){if(tab==='input'&&bunStep==='input')_refreshDraftAfterPull();else _repaintUnlessBun();});
  });
  /* アプリやタブを閉じるとき（iOSでは visibilitychange が来ないことがある）にも未送信分を送る */
  window.addEventListener('pagehide',function(){
    if(_loading)return;
    if(pendingCount())dbPushNow();
    if(_draftTimer)_flushDraft();
  });
  document.addEventListener('click',tapDispatch);
  document.addEventListener('change',function(ev){dispatch(ev,CHANGE_ID,CHANGE_ATTR);});
  document.addEventListener('input',function(ev){dispatch(ev,INPUT_ID,null);});
  document.addEventListener('keydown',function(ev){dispatch(ev,KEY_ID,null);});
}

/* レコードの新旧比較：日付 → 同じ日なら登録順（id） */
function recOrderCmp(a,b){
  var da=a.date||'',db=b.date||'';
  if(da!==db)return da<db?-1:1;
  return (a.id||0)-(b.id||0);
}
function getBunDefaultOrder(){
  return bunMode==='hyakusha'?bunOrderByLatest():bunOrderByPrevWeek();

/* 100射会モード：直前の1レコードの的中率で並べる。
   1日に何度も立つので、週単位ではなく「最後に引いた20射」を見る。 */
function bunOrderByLatest(){
  var base=membersSorted().slice();
  /* 20射に満たなくてもそのレコードの率をそのまま使う。
     自主練(SP)は対象外で、正規練・分附の記録(S)のみ見る。 */
  var scores={};
  base.forEach(function(name){
    var latest=null;
    S.forEach(function(e){
      if(e.mb!==name)return;
      if(!e.sh||e.sh<=0)return;
      if(!latest||recOrderCmp(e,latest)>0)latest=e;
    });
    if(latest)scores[name]=latest.hi/latest.sh;
  });
  return bunSortByScores(base,scores);
}
/* 正規練モード（従来どおり）：前週1週間分の合計的中率で並べる。 */
function bunOrderByPrevWeek(){
  // 前の週を特定：今週の月曜より前で、記録のある一番新しい週
  var cur=wkOf(bunDate),prevK='';
  S.forEach(function(e){var k=recWk(e);if(k&&k<cur&&k>prevK)prevK=k;});
  var base=membersSorted().slice();
  if(!prevK)return base; // 前週データなし→デフォルト順
  // 前週の的中率を計算
  var scores={};
  base.forEach(function(name){
    var entries=S.filter(function(e){return recWk(e)===prevK&&e.mb===name;});
    if(entries.length){
      var sh=entries.reduce(function(a,e){return a+e.sh;},0);
      var hi=entries.reduce(function(a,e){return a+e.hi;},0);
      scores[name]=sh>0?hi/sh:-1;
    }
  });
  return bunSortByScores(base,scores);
}
/* 共通の並べ方：記録あり＝右側（右ほど的中率が高い＝右端がトップ）。
   記録なし＝その左に、右から通し番号昇順（記録ありの直左＝番号が小さい）。 */
function bunSortByScores(base,scores){
  var serialIdx={};base.forEach(function(n,i){serialIdx[n]=i;});
  if(!Object.keys(scores).length)return base; // 誰も記録が無い→通し番号昇順
  return base.sort(function(a,b){
    var ha=scores.hasOwnProperty(a),hb=scores.hasOwnProperty(b);
    if(ha&&hb)return scores[a]-scores[b];
    if(ha)return 1;
    if(hb)return -1;
    return serialIdx[b]-serialIdx[a];
  });
}
/* 並び順が決まった後に出席に加わった部員（出欠の追加・部員の新規追加）を、
   今の並びを崩さずに一番後ろ＝一番左（配列の先頭）へ足す。
   一度に複数いるときは番号の小さい人が右（既存の列寄り）、後から加わった人ほど左。
   最初の並び順は全部員を的中順に並べて作るため、欠席者も的中順の位置に入っている。
   そのままだと欠席→出席に変えた人が的中順の位置に出てしまうので、
   今いない人（欠席・退部、かつ入力済みのマスもない人）は並びから外しておく。 */
function bunAppendNewMembers(key){
  if(_loading)return;   // 部員・出欠が最新になってから判定する
  var att=A.hasOwnProperty(key)?A[key]:null;
  function shown(n){
    if((bunData[n]||[]).some(function(v){return v!=null;}))return true;   // 入力済みの列は残す
    return M.indexOf(n)>=0&&(!att||att.indexOf(n)>=0);
  }
  var kept=bunOrder.filter(shown);
  var add=membersSorted().filter(function(n){return kept.indexOf(n)<0&&shown(n);});
  bunOrder=add.reverse().concat(kept);
  if(add.length&&bunSid)scheduleDbPushDraft();   // 入力中なら他の端末にも同じ並びを送る
}
function getBunMembers(){
  if(isLeagueMode(bunMode))return lgTableSlots(bunMode).map(function(sl){return sl.key;});

  var sorted=bunOrder?bunOrder:membersSorted();

  // 出席リストが他端末の同期で入れ替わった時に、入力済みの列が
  // ensureBunData()で削除されてしまうのを防ぐ。
  if(A.hasOwnProperty(key))return sorted.filter(function(n){

function ensureBunData(){
  if(isLeagueMode(bunMode))bunOrder=getBunMembers();
  else if(!bunOrder)bunOrder=getBunDefaultOrder();
  var members=getBunMembers();
  var shots=bunShotCount();
  members.forEach(function(name){
    if(!bunData[name])bunData[name]=new Array(shots).fill(null);
    else if(bunData[name].length!==shots){
      var old=bunData[name];
      bunData[name]=new Array(shots).fill(null);
      for(var i=0;i<Math.min(old.length,shots);i++)bunData[name][i]=old[i];
    }
  });
  Object.keys(bunData).forEach(function(name){
    if(members.indexOf(name)>=0)return;
    if(!_bunColValid(name)){delete bunData[name];return;}   // 今の分附に属さない列は入力済みでも消す
    if((bunData[name]||[]).some(function(v){return v!=null;}))return; // 入力済みの列は消さない
    delete bunData[name];
  });

/* ===== 分附：変更履歴（どのマスを・いつ・誰が変えたか） =====
   本体データ（/kyudo）とは別の /bunLog に保存するので、普段の読み込みや同期には含まれない。
   1件は「時刻|入力者|部員|何射目|前>後」の短い文字列。分附1回で数十KB程度 */
var LOG_DB='https://shiga-kyudo-dx-default-rtdb.asia-southeast1.firebasedatabase.app/bunLog';
var _logQ=[],_logTimer=null,_logSeq=0,_logBusy=false;
function _lv(v){return v===true?'o':v===false?'x':'-';}
function bunLogPush(name,idx,prev,v){
  var who=(myMb||'')+(adminMode?'[管理者]':shonaiMode?'[渉内]':'');
  var mb=isLeagueMode(bunMode)?((bunLineup[name]||[])[Math.floor(idx/LG_PER)]||name):name;
  var k=Date.now().toString(36)+'-'+('000'+(_logSeq++%1296).toString(36)).slice(-2)+'-'+CLIENT_ID.slice(-4);
  _logQ.push([k,[Date.now(),who,mb,idx+1,_lv(prev)+'>'+_lv(v)].join('|')]);
  _logSchedule(1500);
}
/* 自分の列を押して止められた操作。変更欄は「!＋その時のマスの値＋t(タップ)/l(長押し)」 */
function bunLogBlocked(name,idx,kind){
  var who=(myMb||'')+(adminMode?'[管理者]':shonaiMode?'[渉内]':'');
  var mb=isLeagueMode(bunMode)?((bunLineup[name]||[])[Math.floor(idx/LG_PER)]||name):name;
  var cur=(bunData[name]||[])[idx];
  var k=Date.now().toString(36)+'-'+('000'+(_logSeq++%1296).toString(36)).slice(-2)+'-'+CLIENT_ID.slice(-4);
  _logQ.push([k,[Date.now(),who,mb,idx+1,'!'+_lv(cur==null?null:cur)+(kind||'t')].join('|')]);
  _logSchedule(1500);
}
function _logSchedule(ms){if(_logTimer)clearTimeout(_logTimer);_logTimer=setTimeout(_logFlush,ms);}
function _logFlush(){
  _logTimer=null;
  if(!_logQ.length||_logBusy)return;
  if(!bunSid){_logSchedule(2000);return;}   // 分附のIDが決まってから送る
  var batch=_logQ.splice(0,200),body={},sid=bunSid;
  batch.forEach(function(e){body[e[0]]=e[1];});
  _logBusy=true;
  dbFetch(LOG_DB+'/'+sid,{method:'PATCH',body:JSON.stringify(body)})
    .then(function(r){
      _logBusy=false;
      if(r.status===401||r.status===403)return;   // 書き込みが許可されていない：諦める（入力は止めない）
      if(!r.ok)throw new Error('http '+r.status);
      if(_logQ.length)_logSchedule(300);
    })
    .catch(function(){_logBusy=false;_logQ=batch.concat(_logQ);_logSchedule(8000);});
}

var blgSids=null,blgSel='',blgRows=null,blgErr='',blgOnlyFix=false,blgOnlySelf=false;

function _blgTs(t){var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function blgFetch(path,shallow){
  return authToken().then(function(t){

/* 同じ人が同じマスを3秒以内に続けて変えた操作は1件にまとめる。
   ✗は「空→○→✗」と2回タップで入れるので、まとめないと○→✗が書き換えに見えてしまう。
   （入力側でも、入れてから3秒以内のマスは固定前なので打ち直せる。それと同じ基準） */
function blgMerge(rows){
  var out=[],last={};
  rows.forEach(function(r){
    if(r.c.charAt(0)==='!'){   // 止められた操作：3秒以内に同じマスを続けて押した分は回数にまとめる
      var bk='!'+r.u+'\u0001'+r.m+'\u0001'+r.i,bp=last[bk];
      if(bp&&r.t-bp.t<=BUN_LOCK_MS){bp.n++;bp.t=r.t;return;}
      var bq={t:r.t,u:r.u,m:r.m,i:r.i,c:r.c,n:1};out.push(bq);last[bk]=bq;return;
    }
    var k=r.u+'\u0001'+r.m+'\u0001'+r.i,p=last[k];
    if(p&&r.t-p.t<=BUN_LOCK_MS){
      var a=p.c.split('>'),b=r.c.split('>');
      p.c=a[0]+'>'+b[1];p.t=r.t;
      if(a[0]===b[1]){out.splice(out.indexOf(p),1);delete last[k];}   // 結局元に戻った操作は消す
      return;
    }
    var q={t:r.t,u:r.u,m:r.m,i:r.i,c:r.c};
    out.push(q);last[k]=q;
  });
  return out;
}

function toggleBunShot(name,idx){
  var cur=(bunData[name]||[])[idx];if(cur===undefined)cur=null;

/* マスの値を変える唯一の入口。変更は履歴に残す */
function setBunShot(name,idx,v){
  if(!bunData[name])bunData[name]=new Array(bunShotCount()).fill(null);
  var prev=bunData[name][idx];if(prev===undefined)prev=null;
  if(prev===v)return;
  bunData[name][idx]=v;
  _bunEditAt[name+'\u0001'+idx]=Date.now();
  bunLogPush(name,idx,prev,v);
  var s=v;
  // セルだけ更新（スクロール位置を保つ）
  var cell=document.querySelector('[data-bun-name="'+cssAttr(name)+'"][data-bun-idx="'+idx+'"]');
  if(cell){
    cell.className=bunCellCls(name,idx,s);
    cell.textContent=s===true?'○':s===false?'✗':'';
    _bunRepaint(cell);

  // 合計セルも更新
  var hi=(bunData[name]||[]).filter(function(v){return v===true;}).length;
  var tc=document.querySelector('[data-bun-total="'+cssAttr(name)+'"]');
  if(tc){
    tc.textContent=hi;

/* 小計・合計列を画面から作り直さずに更新する（○×を押した直後の反映用） */
function lgRefreshSubs(){
  var slots=lgTableSlots(bunMode);
  var byTate={},all=[];
  slots.forEach(function(sl){
    if(!byTate[sl.tate])byTate[sl.tate]=[];
    byTate[sl.tate].push(sl.key);all.push(sl.key);
  });
  function hits(keys,from,to){
    var h=0;
    keys.forEach(function(k){
      var col=bunData[k]||[];
      for(var i=from;i<to;i++)if(col[i]===true)h++;
    });
    return h;
  }
  var cells=document.querySelectorAll('[data-bun-sub]');
  for(var i=0;i<cells.length;i++){
    var el=cells[i],gk=el.getAttribute('data-bun-sub'),bk=el.getAttribute('data-bun-blk');
    var keys=(gk==='*')?all:(byTate[gk]||[]);
    var c=el.querySelector('.bs-c'),b=el.querySelector('.bs-b');
    if(bk==='head'){if(c)c.textContent=hits(keys,0,bunShotCount());continue;}
    var bi=parseInt(bk,10);if(isNaN(bi))continue;
    if(c)c.textContent=hits(keys,0,(bi+1)*LG_PER);
    if(b)b.textContent='/'+hits(keys,bi*LG_PER,(bi+1)*LG_PER);
  }
}

function initBunDragDrop(){
  document.querySelectorAll('.bun-dh').forEach(function(handle){

      _bunDrag={name:cell.getAttribute('data-bun-member'),cell:cell};
      cell.classList.add('bun-dragging');

    handle.addEventListener('pointermove',function(e){
      if(!_bunDrag)return;
      document.querySelectorAll('[data-bun-member]').forEach(function(c){c.classList.remove('bun-drop-over');});
      var el=document.elementFromPoint(e.clientX,e.clientY);

      if(target&&target!==_bunDrag.cell)target.classList.add('bun-drop-over');

      document.querySelectorAll('[data-bun-member]').forEach(function(c){c.classList.remove('bun-dragging','bun-drop-over');});
